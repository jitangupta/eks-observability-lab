kind: DaemonSet

serviceAccount:
  create: true

rbac:
  create: true

resources:
  requests:
    cpu: 40m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

serviceMonitor:
  enabled: false

luaScripts:
  enrich.lua: |
    function enrich(tag, timestamp, record)
      local kubernetes = record["kubernetes"] or {}
      local labels = kubernetes["labels"] or {}

      record["namespace"] = kubernetes["namespace_name"] or "unknown"
      record["container"] = kubernetes["container_name"] or "unknown"
      record["pod"] = kubernetes["pod_name"] or "unknown"
      record["service"] = labels["app"] or labels["app.kubernetes.io/name"] or record["container"]

      local level = record["level"] or record["severity"] or record["severity_text"] or "info"
      level = string.lower(tostring(level))
      if level == "warning" then
        level = "warn"
      end
      if level ~= "debug" and level ~= "info" and level ~= "warn" and level ~= "error" and level ~= "fatal" then
        level = "info"
      end
      record["level"] = level

      return 1, timestamp, record
    end

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 2
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 10MB
        Skip_Long_Lines On
        Refresh_Interval 10

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log On
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

    [FILTER]
        Name grep
        Match kube.*
        Regex $kubernetes['namespace_name'] ^(online-boutique|observability)$

    [FILTER]
        Name lua
        Match kube.*
        script /fluent-bit/scripts/enrich.lua
        call enrich

  outputs: |
    [OUTPUT]
        Name loki
        Match kube.*
        Host logs-prod-028.grafana.net
        Port 443
        URI /loki/api/v1/push
        TLS On
        TLS.Verify On
        HTTP_User 1704359
        HTTP_Passwd ${GRAFANA_CLOUD_TOKEN}
        Compress gzip
        Labels cluster=${CLUSTER_NAME},namespace=$namespace,service=$service,container=$container,level=$level
        Structured_Metadata pod=$pod
        Line_Format json
        Retry_Limit False

  customParsers: |
    [PARSER]
        Name docker_no_time
        Format json
        Time_Keep Off
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
